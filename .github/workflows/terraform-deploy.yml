name: Reviewed Terraform Deployment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to plan or deploy
        type: choice
        options: [dev, staging, prod]
        required: true
      apply:
        description: Apply the saved plan after environment approval
        type: boolean
        default: false
      production_confirmation:
        description: Enter prod to enable a production apply
        type: string
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: terraform-deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  controls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify deployment controls
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
          APPLY_REQUESTED: ${{ inputs.apply }}
          PRODUCTION_CONFIRMATION: ${{ inputs.production_confirmation }}
        run: |
          if [ "$APPLY_REQUESTED" = "true" ] && [ "$TARGET_ENVIRONMENT" = "prod" ]; then
            test "$PRODUCTION_CONFIRMATION" = "prod"
          fi
          python scripts/check-deployment-controls.py "$TARGET_ENVIRONMENT"

  plan:
    needs: controls
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}-plan
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - name: Require separate plan and apply roles and encrypted plan storage
        env:
          PLAN_ROLE: ${{ vars.AWS_PLAN_ROLE_ARN }}
          APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
          PLAN_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
          TF_VARS_JSON: ${{ secrets.TERRAFORM_INPUTS }}
        run: |
          test -n "$PLAN_ROLE" && test -n "$APPLY_ROLE" && test "$PLAN_ROLE" != "$APPLY_ROLE"
          test "${#PLAN_KEY}" -ge 32
          python - <<'PY'
          import json, os
          from pathlib import Path
          values = json.loads(os.environ["TF_VARS_JSON"])
          if not isinstance(values, dict):
              raise ValueError("TERRAFORM_INPUTS must be a JSON object")
          allowed = {"db_username", "db_password", "certificate_arn", "alarm_topic_arn", "enable_https"}
          if values.keys() - allowed:
              raise ValueError("Commit network and environment settings in terraform.tfvars; TERRAFORM_INPUTS accepts credentials and certificate/alarm settings only")
          target = Path("ci.auto.tfvars.json")
          target.write_text(json.dumps(values))
          target.chmod(0o600)
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PLAN_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: terraform-plan-${{ github.run_id }}
      - name: Initialize, validate, and test
        run: |
          terraform init -input=false
          terraform fmt -check -recursive
          terraform validate
          terraform test
      - name: Enforce security scan
        run: |
          python -m pip install checkov
          checkov -d . --framework terraform --compact
      - name: Generate and review saved plan
        run: |
          terraform plan -input=false -lock-timeout=5m -out=deployment.tfplan
          terraform show -no-color deployment.tfplan
      - name: Encrypt saved plan
        env:
          PLAN_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
          EXPECTED_APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path("plan-metadata.json").write_text(json.dumps({
              "environment": os.environ["TARGET_ENVIRONMENT"],
              "commit": os.environ["GITHUB_SHA"],
              "apply_role": os.environ["EXPECTED_APPLY_ROLE"],
          }))
          PY
          printf '%s' "$PLAN_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --symmetric --cipher-algo AES256 --output deployment.tfplan.gpg deployment.tfplan
          rm deployment.tfplan ci.auto.tfvars.json
      - uses: actions/upload-artifact@v4
        with:
          name: reviewed-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: |
            terraform/environments/${{ inputs.environment }}/deployment.tfplan.gpg
            terraform/environments/${{ inputs.environment }}/.terraform.lock.hcl
            terraform/environments/${{ inputs.environment }}/plan-metadata.json
          include-hidden-files: true
          retention-days: 1
          if-no-files-found: error

  apply:
    if: ${{ inputs.apply }}
    needs: [controls, plan]
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      actions: read
      id-token: write
    defaults:
      run:
        working-directory: terraform/environments/${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recheck approval controls before applying
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: python scripts/check-deployment-controls.py "$TARGET_ENVIRONMENT"
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"
          terraform_wrapper: false
      - uses: actions/download-artifact@v4
        with:
          name: reviewed-plan-${{ inputs.environment }}-${{ github.run_id }}
          path: terraform/environments/${{ inputs.environment }}
      - name: Verify plan environment, commit, and deployment role
        env:
          EXPECTED_APPLY_ROLE: ${{ vars.AWS_APPLY_ROLE_ARN }}
          TARGET_ENVIRONMENT: ${{ inputs.environment }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          metadata = json.loads(Path("plan-metadata.json").read_text())
          assert metadata == {
              "environment": os.environ["TARGET_ENVIRONMENT"],
              "commit": os.environ["GITHUB_SHA"],
              "apply_role": os.environ["EXPECTED_APPLY_ROLE"],
          }, "The reviewed plan does not match this environment, commit, or role"
          PY
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_APPLY_ROLE_ARN }}
          aws-region: ap-northeast-1
          role-session-name: terraform-apply-${{ github.run_id }}
      - name: Apply exactly the reviewed plan
        env:
          PLAN_KEY: ${{ secrets.PLAN_ENCRYPTION_KEY }}
        run: |
          test "${#PLAN_KEY}" -ge 32
          printf '%s' "$PLAN_KEY" | gpg --batch --yes --pinentry-mode loopback --passphrase-fd 0 --output deployment.tfplan --decrypt deployment.tfplan.gpg
          terraform init -input=false -lockfile=readonly
          terraform apply -input=false -lock-timeout=5m deployment.tfplan
          terraform output
      - name: Remove local plan material
        if: always()
        run: rm -f deployment.tfplan deployment.tfplan.gpg
