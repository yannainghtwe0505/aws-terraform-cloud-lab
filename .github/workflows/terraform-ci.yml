name: Terraform CI

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-deploy.yml"
      - "scripts/check-deployment-controls.py"

  push:
    branches:
      - main
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-ci.yml"
      - ".github/workflows/terraform-deploy.yml"
      - "scripts/check-deployment-controls.py"

permissions:
  contents: read

jobs:
  terraform-quality:
    name: Terraform Format, Validate and Test
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        directory:
          - terraform/modules/application_config
          - terraform/modules/networking
          - terraform/environments/dev
          - terraform/environments/staging
          - terraform/environments/prod
          - terraform/modules/deployment-access
          - terraform/modules/alb
          - terraform/bootstrap/deployment-access

    defaults:
      run:
        working-directory: ${{ matrix.directory }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform
        run: terraform init -backend=false -input=false

      - name: Validate Terraform
        run: terraform validate

      - name: Run Terraform tests
        run: terraform test

  terraform-security:
    name: Terraform Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Checkov
        run: python -m pip install checkov

      - name: Scan Terraform environments
        run: |
          checkov \
            -d terraform/environments \
            --framework terraform \
            --compact

  deployment-control-tests:
    name: Deployment control tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -B -m unittest discover -s scripts/tests -v
